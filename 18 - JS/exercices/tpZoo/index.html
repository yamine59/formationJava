<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-gray-100">
    
    <script type="module" src="./main.js"></script>

    <h1 class="text-3xl font-bold text-center mb-5">Gestion des animaux</h1>
    <div class="flex justify-center  items-center mx-10">
        <form action="" class="flex flex-row gap-3">
            <input id="nom" type="text" class="border border-gray-300 rounded p-2" placeholder="Nom" required />
            <input id="age" type="number" class="border border-gray-300 rounded p-2" placeholder="Age" required/>
            <select id="espece" class="border border-gray-300 rounded p-2">
                <option value="" disabled selected>Espèce</option>
                <option value="Lion">Lion</option>
                <option value="Perroquet">Perroquet</option>
            </select>
            <button id="ajouter" type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Ajouter</button>
        </form>
        
    </div>

    <div id="cards" class="mt-5 flex flex-wrap justify-center gap-4"></div>
    <div id="action" class="mt-5 flex flex-wrap justify-center gap-4"></div>

</body>



</html>
